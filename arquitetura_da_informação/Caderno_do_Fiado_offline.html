<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno do Fiado</title>
<meta name="description" content="Aplicativo do fiado: a dona anota compras e pagamentos, o cliente confere saldo e extrato.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF1F6;
  --surface:#FFFFFF;
  --surface-2:#F5F7FB;
  --ink:#14213A;
  --muted:#58657E;
  --line:#D6DDE8;
  --blue:#1E4D8C;
  --on-blue:#FFFFFF;
  --blue-soft:#E2EBF7;
  --red:#B3322A;
  --red-soft:#FBE8E5;
  --green:#1D7447;
  --on-green:#FFFFFF;
  --green-soft:#E0F2E8;
  --amber:#8F5700;
  --amber-soft:#FDF0D6;
  --paper:#FFFEF9;
  --rule:#CFDCEE;
  --margin:#E4A3A0;
  --shadow:0 1px 2px rgba(20,33,58,.06),0 6px 18px rgba(20,33,58,.07);
  --focus:#1E4D8C;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1523; --surface:#161F31; --surface-2:#1B2539; --ink:#E7EDF7; --muted:#9BA8BF; --line:#2A3651;
    --blue:#86ADE8; --on-blue:#0E1523; --blue-soft:#1C2B46;
    --red:#F2958A; --red-soft:#3A2023; --green:#72D3A0; --on-green:#0E1523; --green-soft:#153126;
    --amber:#F1C36A; --amber-soft:#382C13; --paper:#172136; --rule:#243352; --margin:#7B3D3D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); --focus:#86ADE8;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1523; --surface:#161F31; --surface-2:#1B2539; --ink:#E7EDF7; --muted:#9BA8BF; --line:#2A3651;
  --blue:#86ADE8; --on-blue:#0E1523; --blue-soft:#1C2B46;
  --red:#F2958A; --red-soft:#3A2023; --green:#72D3A0; --on-green:#0E1523; --green-soft:#153126;
  --amber:#F1C36A; --amber-soft:#382C13; --paper:#172136; --rule:#243352; --margin:#7B3D3D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.25); --focus:#86ADE8;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- casca ---------- */
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 16px 8px;border-bottom:1px solid transparent}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-title{flex:1;min-width:0}
.eyebrow{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px;flex:none;max-width:45%}
.who span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--blue-soft);color:var(--blue);flex:none}
.avatar.cli{background:var(--red-soft);color:var(--red)}
.avatar.lg{width:44px;height:44px;font-size:18px}
.screen{padding:8px 16px 28px;display:flex;flex-direction:column;gap:16px}
.has-nav .screen{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.has-foot .screen{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.banner{margin:0 16px 4px;padding:8px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600}

.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:56px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--blue)}
.tab[aria-current="page"] svg{background:var(--blue-soft);border-radius:999px;padding:2px 12px;width:48px}
.tab .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:var(--surface);font-size:11px;display:grid;place-items:center;padding:0 5px}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.foot .sum{flex:1;min-width:0}
.foot .sum small{display:block;color:var(--muted);font-size:13px}
.foot .sum strong{font-family:var(--display);font-size:22px}

/* ---------- elementos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.green:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn.block{width:100%}
.btn.tall{min-height:64px;font-size:17px;flex-direction:column;gap:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec{font-size:17px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.sec small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:14px}
.hello{font-size:15px;color:var(--muted);margin:4px 0 -4px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.devendo{background:var(--blue-soft);color:var(--blue)}
.chip.atraso{background:var(--red-soft);color:var(--red)}
.chip.emdia{background:var(--green-soft);color:var(--green)}
.chip.credito{background:var(--green-soft);color:var(--green)}
.chip.aberta{background:var(--amber-soft);color:var(--amber)}
.chip.neutro{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid transparent;text-align:left;width:100%;cursor:pointer;background:var(--amber-soft);color:var(--ink)}
.alert svg{color:var(--amber);flex:none;margin-top:1px}
.alert.red{background:var(--red-soft)}
.alert.red svg{color:var(--red)}
.alert strong{display:block}
.alert span{font-size:14px;color:var(--muted)}
div.alert{cursor:default}

/* caderno: a página pautada com margem vermelha */
.paper{position:relative;background-color:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 18px 58px;overflow:hidden;box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 16px}
.paper::before{content:"";position:absolute;left:42px;top:0;bottom:0;width:2px;background:var(--margin)}
.paper .p-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:32px;text-transform:uppercase;letter-spacing:.02em}
.paper .p-name small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.paper .p-label{line-height:32px;color:var(--muted);font-size:15px}
.paper .p-amount{font-family:var(--display);font-weight:800;font-size:46px;line-height:64px;letter-spacing:-.02em}
.paper .p-amount.deve{color:var(--red)}
.paper .p-amount.ok{color:var(--green)}
.paper .p-foot{line-height:32px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.summary{display:grid;gap:4px;background:var(--blue);color:var(--on-blue);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.summary .label{font-size:14px;opacity:.85;font-weight:600}
.summary .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.summary .sub{font-size:14px;opacity:.85}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.stat strong{font-family:var(--display);font-size:22px}
.stat.wide{grid-column:1/-1}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:12px 14px;text-align:left;cursor:pointer;min-height:60px}
button.lrow:hover{background:var(--surface-2)}
.ldate{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);width:44px;text-align:center;line-height:1.1}
.ldate small{display:block;font-family:var(--body);font-weight:500;font-size:11px}
.ldesc{min-width:0}
.ldesc strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldesc small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lval{font-family:var(--display);font-weight:700;font-size:17px;text-align:right;white-space:nowrap}
.lval small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.lval.compra{color:var(--ink)}
.lval.pag{color:var(--green)}
.cancel .ldesc strong,.cancel .lval{text-decoration:line-through;opacity:.55}
.tagline{display:inline-flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

/* formulários */
.field{display:grid;gap:6px}
.field label,.legend{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;font-size:16px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;min-height:64px}
.money:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.money span{font-family:var(--display);font-weight:700;font-size:22px;color:var(--muted);margin-right:8px}
.money input{border:0;background:transparent;outline:none;font-family:var(--display);font-weight:800;font-size:32px;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600;cursor:pointer}
.pick[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg label{display:grid;place-items:center;min-height:44px;border-radius:9px;font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{background:var(--surface);box-shadow:var(--shadow);color:var(--blue)}
.seg span{display:grid;place-items:center;width:100%;height:100%;border-radius:9px;min-height:44px}
.seg label:has(input:focus-visible) span{outline:3px solid var(--focus)}
.radio-list{display:grid;gap:8px}
.radio-list label{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:52px;cursor:pointer;font-weight:500}
.radio-list input{width:20px;height:20px;accent-color:var(--blue)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--blue);flex:none}
.err{color:var(--red);font-size:14px;font-weight:600}

/* cardápio com contador */
.cat{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 0 -6px}
.prod{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px}
.prod .pinfo{flex:1;min-width:0}
.prod .pinfo strong{display:block;font-weight:600}
.prod .pinfo small{color:var(--muted);font-size:14px}
.prod.sel{background:var(--blue-soft)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.stepper button:hover{background:var(--surface-2)}
.stepper output{min-width:28px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.more summary{min-height:52px;display:flex;align-items:center;font-weight:600;cursor:pointer;color:var(--blue)}
details.more[open]{padding-bottom:14px}
details.more .grid{display:grid;grid-template-columns:1fr 130px;gap:10px}

/* detalhe */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600}
.items{width:100%;border-collapse:collapse;font-size:15px}
.items td{padding:8px 0;border-bottom:1px solid var(--line)}
.items td:last-child{text-align:right}
.items tfoot td{border-bottom:0;font-weight:700;font-family:var(--display);font-size:18px;padding-top:12px}
.quote{border-left:3px solid var(--amber);padding:6px 0 6px 12px;margin:8px 0;color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
table.rep th:first-child,table.rep td:first-child{text-align:left}
table.rep td{padding:10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.rep tr:last-child td{border-bottom:0}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;gap:20px;padding:28px 16px 28px;max-width:480px;margin:0 auto}
.brand h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.brand p{color:var(--muted);margin:8px 0 0;font-size:16px;max-width:34ch}
.mini-page{font-family:var(--display);font-size:15px;line-height:28px;padding:10px 16px 12px 52px;background-size:auto;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-position:0 10px}
.mini-page::before{left:38px}
.mini-page s{color:var(--muted);text-decoration-color:var(--red)}
.demo{display:grid;gap:8px}
.demo .btn{justify-content:flex-start;text-align:left}
.demo .btn small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.demo .btn.primary small{color:inherit;opacity:.8}
.fine{font-size:13px;color:var(--muted)}
.code-input{letter-spacing:.5em;font-family:var(--display);font-weight:700;font-size:28px;text-align:center}

/* folha (bottom sheet) e aviso */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(10,16,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .18s ease-out}
.sheet h2{font-size:20px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:var(--shadow);width:max-content}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
.setup{padding:28px 16px;max-width:480px;margin:0 auto;display:grid;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>


<div id="app"><div class="loading">Abrindo o caderno…</div></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
document.documentElement.lang = "pt-BR";

/* ============ configurações do protótipo ============ */
const APP_URL = "https://claude.ai/artifact/QrZ4FiNrEjUv5Hj77rFRf4";  // link do app, usado no convite
const DEMO_CODE = "1234";     // código de teste (no app real viria por SMS)
const LOCAL_KEY = "caderno-do-fiado-v1";
const SESS_KEY = "caderno-do-fiado-sessao";
const COLS = ["clientes", "lancamentos", "produtos", "config"];
const CATEGORIAS = ["Salgados", "Bebidas", "Doces", "Outros"];
const FORMAS = ["Dinheiro", "Pix", "Cartão"];
const MOTIVOS = ["Não fiz essa compra", "O valor está errado", "Já paguei isso", "Outro motivo"];

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const money = (c) => BRL.format((c || 0) / 100);
function parseMoney(str) {
  let s = String(str ?? "").trim().replace(/[^\d,.]/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const v = Number(s);
  return Number.isFinite(v) ? Math.round(v * 100) : NaN;
}
const toInput = (c) => (c / 100).toFixed(2).replace(".", ",");
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const fmtD = (iso) => { const [, m, d] = String(iso).split("-"); return `${d}/${m}`; };
const fmtDLong = (iso) => { const [y, m, d] = String(iso).split("-"); return `${+d} de ${MESES[+m - 1]}. de ${y}`; };
const daysBetween = (a, b) => Math.round((Date.parse(b + "T12:00:00") - Date.parse(a + "T12:00:00")) / 86400000);
function fmtHora(ts) { try { return new Date(ts).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
const digits = (s) => String(s || "").replace(/\D/g, "");
function fmtPhone(s) { const d = digits(s); if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return s || ""; }
function rid() { try { return crypto.randomUUID().replace(/-/g, "").slice(0, 20); } catch (e) { return Math.random().toString(36).slice(2) + Date.now().toString(36); } }
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const initial = (n) => esc(String(n || "?").trim().charAt(0).toUpperCase());
function saudacao() { const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
function waLink(phone, text) { const d = digits(phone); return `https://wa.me/${d ? "55" + d : ""}?text=${encodeURIComponent(text)}`; }

/* ============ armazenamento: banco compartilhado ou este aparelho ============ */
const Store = {
  mode: "loading", db: null, readOnly: false, loaded: new Set(),
  data: { clientes: {}, lancamentos: {}, produtos: {}, config: {} },
  subs: [],
  emit() { this.subs.forEach((f) => f()); },
  get ready() { return this.mode === "local" || (this.mode === "db" && this.loaded.size === COLS.length); },
  get empty() { return !this.data.config.loja; },
  async start() {
    let db = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { db = await window.claude.use("db"); } catch (e) { db = null; }
    }
    if (db) {
      this.mode = "db"; this.db = db;
      COLS.forEach((col) => {
        db.collection(col).onSnapshot((snap) => {
          const m = {}; snap.docs.forEach((d) => { m[d.id] = d.data(); });
          this.data[col] = m; this.loaded.add(col); this.emit();
        }, (err) => {
          console.warn("db", col, err);
          this.loaded.add(col);
          if (err && err.code === "revoked") this.readOnly = true;
          toast("A conexão com os dados caiu. Recarregue a página.");
          this.emit();
        });
      });
    } else {
      this.mode = "local"; this.loadLocal(); this.emit();
    }
  },
  loadLocal() {
    let raw = null; try { raw = localStorage.getItem(LOCAL_KEY); } catch (e) {}
    if (raw) { try { const d = JSON.parse(raw); COLS.forEach((c) => { d[c] = d[c] || {}; }); this.data = d; return; } catch (e) {} }
    this.data = exemplo(); this.saveLocal();
  },
  saveLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.data)); } catch (e) {} },
  newId(col) { if (this.mode === "db") { try { return this.db.collection(col).doc().id; } catch (e) {} } return rid(); },
  async run(fn) {
    try { await fn(); return true; }
    catch (e) {
      if (e && e.code === "unavailable") {
        await new Promise((r) => setTimeout(r, 600 + Math.random() * 600));
        try { await fn(); return true; } catch (e2) { e = e2; }
      }
      const code = e && e.code;
      if (code === "invalid_argument") { this.readOnly = true; toast("Você só pode ver estes dados, não alterar."); }
      else if (code === "quota_exceeded") toast("O caderno está cheio. Apague registros antigos para continuar.");
      else toast("Não foi possível salvar agora. Tente de novo.");
      console.warn(e); render(); return false;
    }
  },
  async put(col, id, obj) {
    if (this.mode === "db") return this.run(() => this.db.collection(col).doc(id).set(obj));
    this.data[col][id] = JSON.parse(JSON.stringify(obj)); this.saveLocal(); this.emit(); return true;
  },
  async patch(col, id, p) {
    if (this.mode === "db") return this.run(() => this.db.collection(col).doc(id).update(p));
    this.data[col][id] = Object.assign({}, this.data[col][id], JSON.parse(JSON.stringify(p))); this.saveLocal(); this.emit(); return true;
  },
  async loadAll(seed) {
    if (this.mode !== "db") { this.data = seed; this.saveLocal(); this.emit(); return true; }
    for (const col of COLS) for (const [id, body] of Object.entries(seed[col])) { if (!(await this.put(col, id, body))) return false; }
    return true;
  },
};

/* ============ regras do fiado ============ */
const C = {
  cfg() { return Object.assign({ nomeLoja: "Lanchonete", nomeDona: "Dona", telefoneDona: "", prazoAtraso: 30 }, Store.data.config.loja || {}); },
  clientes() { return Object.entries(Store.data.clientes).map(([id, c]) => Object.assign({ id }, c)); },
  cliente(id) { const c = Store.data.clientes[id]; return c ? Object.assign({ id }, c) : null; },
  produtos() { return Object.entries(Store.data.produtos).map(([id, p]) => Object.assign({ id }, p)).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")); },
  todos() { return Object.entries(Store.data.lancamentos).map(([id, l]) => Object.assign({ id }, l)); },
  lanc(id) { const l = Store.data.lancamentos[id]; return l ? Object.assign({ id }, l) : null; },
  chrono(a, b) { return String(a.data).localeCompare(String(b.data)) || String(a.criadoEm).localeCompare(String(b.criadoEm)); },
  doCliente(cid) { return C.todos().filter((l) => l.clienteId === cid).sort(C.chrono); },
  sinal(l) { return l.cancelado ? 0 : l.tipo === "compra" ? l.valor : -l.valor; },
  saldo(cid) { return C.doCliente(cid).reduce((s, l) => s + C.sinal(l), 0); },
  extrato(cid) { let s = 0; return C.doCliente(cid).map((l) => { s += C.sinal(l); return Object.assign({ saldoApos: s }, l); }); },
  ultimoPag(cid) { const p = C.doCliente(cid).filter((l) => l.tipo === "pagamento" && !l.cancelado); return p[p.length - 1] || null; },
  status(cid) {
    const saldo = C.saldo(cid);
    if (saldo < 0) return { k: "credito", label: "Com crédito" };
    if (saldo === 0) return { k: "emdia", label: "Em dia" };
    const up = C.ultimoPag(cid);
    const primeira = C.doCliente(cid).find((l) => l.tipo === "compra" && !l.cancelado);
    const ref = up ? up.data : primeira ? primeira.data : todayISO();
    const dias = Math.max(0, daysBetween(ref, todayISO()));
    if (dias > C.cfg().prazoAtraso) return { k: "atraso", label: `Em atraso · ${dias} dias`, dias };
    return { k: "devendo", label: "Devendo", dias };
  },
  abertas(cid) { return C.todos().filter((l) => l.contestacao && l.contestacao.status === "aberta" && (!cid || l.clienteId === cid)).sort((a, b) => String(b.contestacao.em).localeCompare(String(a.contestacao.em))); },
  desc(l) {
    if (l.tipo === "pagamento") return "Pagamento";
    const it = l.itens || [];
    if (!it.length) return "Compra";
    return it.map((i) => (i.qtd > 1 ? `${i.nome} ×${i.qtd}` : i.nome)).join(", ");
  },
};

/* ============ estado da interface ============ */
const S = { sess: null, stack: [], form: {}, sheet: null, login: { step: "tel", tel: "", code: "", err: "" } };
function loadSess() { try { const s = JSON.parse(localStorage.getItem(SESS_KEY) || "null"); if (s && s.perfil) S.sess = s; } catch (e) {} }
function saveSess() { try { if (S.sess) localStorage.setItem(SESS_KEY, JSON.stringify(S.sess)); else localStorage.removeItem(SESS_KEY); } catch (e) {} }
const cur = () => S.stack[S.stack.length - 1] || { name: "inicio" };
function go(v) { S.stack.push(v); S.form = {}; S.sheet = null; render(); window.scrollTo(0, 0); }
function replace(v) { S.stack[S.stack.length - 1] = v; S.form = {}; S.sheet = null; render(); window.scrollTo(0, 0); }
function back() { if (S.stack.length > 1) { S.stack.pop(); S.form = {}; S.sheet = null; render(); window.scrollTo(0, 0); } }
function home() { resetTo({ name: S.sess && S.sess.perfil === "cliente" ? "saldo" : "inicio" }); }
function resetTo(v) { S.stack = [v]; S.form = {}; S.sheet = null; render(); window.scrollTo(0, 0); }
function entrar(sess) { S.sess = sess; saveSess(); S.login = { step: "tel", tel: "", code: "", err: "" }; home(); toast(sess.perfil === "dona" ? `Bem-vinda, ${C.cfg().nomeDona}!` : `Olá, ${C.cliente(sess.clienteId).nome}!`); }
function sair() { S.sess = null; saveSess(); S.stack = []; S.sheet = null; render(); }

/* ============ pedaços de tela ============ */
function statusChip(cid) { const s = C.status(cid); return `<span class="chip ${s.k}">${esc(s.label)}</span>`; }

function lancRow(l, opts = {}) {
  const pag = l.tipo === "pagamento";
  const cli = opts.showCliente ? C.cliente(l.clienteId) : null;
  const sub = [];
  if (cli) sub.push(esc(cli.nome));
  sub.push(pag ? esc(l.forma || "Pagamento") : "Compra");
  if (opts.saldo && l.saldoApos != null && !l.cancelado) sub.push(`saldo ${money(l.saldoApos)}`);
  const tags = [];
  if (l.cancelado) tags.push('<span class="chip neutro">Cancelado</span>');
  if (l.contestacao) tags.push(l.contestacao.status === "aberta" ? '<span class="chip aberta">Contestado</span>' : `<span class="chip neutro">Contestação ${l.contestacao.status === "aceita" ? "aceita" : "respondida"}</span>`);
  const [y] = String(l.data).split("-");
  return `<button class="lrow${l.cancelado ? " cancel" : ""}" data-action="go" data-view="${opts.view || "lanc"}" data-id="${esc(l.id)}">
    <span class="ldate num">${fmtD(l.data)}${y !== todayISO().slice(0, 4) ? `<small>${y}</small>` : ""}</span>
    <span class="ldesc"><strong>${esc(C.desc(l))}</strong><small>${sub.join(" · ")}</small>${tags.length ? `<span class="tagline">${tags.join("")}</span>` : ""}</span>
    <span class="lval num ${pag ? "pag" : "compra"}">${pag ? "− " : "+ "}${money(l.valor)}</span>
  </button>`;
}

function extratoList(cid, view) {
  const ex = C.extrato(cid).reverse();
  if (!ex.length) return `<div class="list"><p class="empty">Nenhuma anotação ainda.</p></div>`;
  return `<div class="list">${ex.map((l) => lancRow(l, { saldo: true, view })).join("")}</div>`;
}

function paperCard(c, forCliente) {
  const saldo = C.saldo(c.id);
  const up = C.ultimoPag(c.id);
  let label, amount, cls;
  if (saldo > 0) { label = forCliente ? "Você deve" : "Deve"; amount = money(saldo); cls = "deve"; }
  else if (saldo < 0) { label = forCliente ? "Você tem crédito de" : "Tem crédito de"; amount = money(-saldo); cls = "ok"; }
  else { label = forCliente ? "Você não deve nada" : "Não deve nada"; amount = money(0); cls = "ok"; }
  return `<section class="paper" aria-label="Saldo de ${esc(c.nome)}">
    <div class="p-name">${esc(c.nome)}${c.apelido ? `<small>${esc(c.apelido)}</small>` : ""}</div>
    <div class="p-label">${label}</div>
    <div class="p-amount num ${cls}">${amount}</div>
    <div class="p-foot">${statusChip(c.id)}<span class="muted small">${up ? `Último pagamento: ${fmtD(up.data)} · ${money(up.valor)}` : "Nenhum pagamento ainda"}</span></div>
  </section>`;
}

function clienteRow(c, action = "go", view = "ficha", extra = "") {

function ordenarClientes(list) {
  const peso = { atraso: 0, devendo: 1, credito: 2, emdia: 3 };
  return list.sort((a, b) => peso[C.status(a.id).k] - peso[C.status(b.id).k] || C.saldo(b.id) - C.saldo(a.id) || a.nome.localeCompare(b.nome, "pt-BR"));
}

V.relatorios = () => {
  const cfg = C.cfg(), t = todayISO();
  const cls = C.clientes();
  const devendo = ordenarClientes(cls.filter((c) => C.saldo(c.id) > 0));
  const total = devendo.reduce((s, c) => s + C.saldo(c.id), 0);
  const atraso = devendo.filter((c) => C.status(c.id).k === "atraso");
  const per = S.form.per || "30";
  const ini = per === "tudo" ? "0000-00-00" : per === "mes" ? t.slice(0, 8) + "01" : addDays(t, -(+per - 1));
  const noPer = C.todos().filter((l) => !l.cancelado && l.data >= ini && l.data <= t);
  const vend = noPer.filter((l) => l.tipo === "compra").reduce((s, l) => s + l.valor, 0);
  const rec = noPer.filter((l) => l.tipo === "pagamento").reduce((s, l) => s + l.valor, 0);
  // semanas (segunda a domingo), as 6 mais recentes
  const d0 = new Date(t + "T12:00:00"); const dow = (d0.getDay() + 6) % 7; const seg = addDays(t, -dow);
  const semanas = [];
  for (let i = 0; i < 6; i++) {
    const a = addDays(seg, -7 * i), b = addDays(a, 6);
    const ls = C.todos().filter((l) => !l.cancelado && l.data >= a && l.data <= b);
    semanas.push({ a, b, v: ls.filter((l) => l.tipo === "compra").reduce((s, l) => s + l.valor, 0), r: ls.filter((l) => l.tipo === "pagamento").reduce((s, l) => s + l.valor, 0) });
  }
  return {
    title: "Relatórios",
    body: `
      <section class="summary"><span class="label">Total a receber</span><strong class="big num">${money(total)}</strong><span class="sub">${plural(devendo.length, "cliente devendo", "clientes devendo")} · ${plural(atraso.length, "em atraso", "em atraso")}</span></section>

/* ============ telas do cliente ============ */
V.saldo = () => {
  const c = C.cliente(S.sess.clienteId); const cfg = C.cfg();
  const ex = C.extrato(c.id); const up = C.ultimoPag(c.id);
  const depois = up ? ex.filter((l) => l.tipo === "compra" && !l.cancelado && C.chrono(l, up) > 0) : ex.filter((l) => l.tipo === "compra" && !l.cancelado);
  const minhas = C.todos().filter((l) => l.clienteId === c.id && l.contestacao).sort((a, b) => String(b.contestacao.em).localeCompare(String(a.contestacao.em)));
  const ultima = ex[ex.length - 1];
  return {
    title: "Meu saldo",
    body: `
      ${paperCard(c, true)}
      <p class="muted small" style="margin:-6px 0 0">na ${esc(cfg.nomeLoja)}${ultima ? ` · última anotação em ${fmtD(ultima.data)}` : ""}</p>
      <div class="stats">
        <div class="stat"><small>${up ? `Compras desde ${fmtD(up.data)}` : "Compras no fiado"}</small><strong class="num">${money(depois.reduce((s, l) => s + l.valor, 0))}</strong><div class="muted small">${plural(depois.length, "anotação", "anotações")}</div></div>
        <div class="stat"><small>Último pagamento</small><strong class="num" style="color:var(--green)">${up ? money(up.valor) : "—"}</strong><div class="muted small">${up ? `${fmtD(up.data)} · ${esc(up.forma || "")}` : "nenhum ainda"}</div></div>
      </div>
      ${minhas.map((l) => `<button class="alert" style="${l.contestacao.status === "aberta" ? "" : "background:var(--surface-2)"}" data-action="go" data-view="detalhe" data-id="${esc(l.id)}">${icon("flag")}<div><strong>${l.contestacao.status === "aberta" ? "Contestação enviada" : l.contestacao.status === "aceita" ? "A dona aceitou sua contestação" : "A dona respondeu sua contestação"}</strong><span>${esc(C.desc(l))} de ${fmtD(l.data)}${l.contestacao.status === "aberta" ? " · aguardando resposta" : ""}</span></div></button>`).join("")}

  };
};
V.extrato = () => {

V.contestar = (v) => {

      <div class="field"><label for="sh-motivo">Motivo</label><input id="sh-motivo" class="input" data-sf="motivo" value="${esc(S.sheet.motivo || "")}" placeholder="Ex.: anotei no cliente errado"></div>

/* ============ desenho da tela ============ */
let pending = false;
const TABS = {
  dona: [["inicio", "Início", "home"], ["clientes", "Clientes", "users"], ["produtos", "Produtos", "box"], ["relatorios", "Relatórios", "chart"]],
  cliente: [["saldo", "Meu saldo", "wallet"], ["extrato", "Extrato", "list"], ["falar", "Falar com a dona", "chat"]],
};
function editing() { const a = document.activeElement; return a && a.closest && a.closest("#app") && a.matches("input:not([type=radio]):not([type=checkbox]),textarea,select"); }

function render() {
  if (editing()) { pending = true; return; }
  pending = false;
  const app = $("#app");
  if (!Store.ready) { app.innerHTML = `<div class="loading">Abrindo o caderno…</div>`; return; }
  if (Store.empty) { app.innerHTML = setupView(); return; }
  if (S.sess && S.sess.perfil === "cliente" && !C.cliente(S.sess.clienteId)) { S.sess = null; saveSess(); }
  if (!S.sess) { app.innerHTML = loginView(); return; }
  if (!S.stack.length) S.stack = [{ name: S.sess.perfil === "cliente" ? "saldo" : "inicio" }];
  const v = cur();
  const donaViews = ["inicio", "clientes", "escolher", "ficha", "novoCliente", "convite", "compra", "pagamento", "lanc", "produtos", "produtoForm", "relatorios", "ajustes"];
  const cliViews = ["saldo", "extrato", "detalhe", "contestar", "falar"];
  if (!(S.sess.perfil === "dona" ? donaViews : cliViews).includes(v.name)) { S.stack = [{ name: S.sess.perfil === "cliente" ? "saldo" : "inicio" }]; }
  const out = V[cur().name](cur());
  const tabs = TABS[S.sess.perfil];
  const topName = S.stack[0].name;
  const isTop = S.stack.length === 1 && !out.back;
  const cfg = C.cfg();
  const whoName = S.sess.perfil === "dona" ? cfg.nomeDona : C.cliente(S.sess.clienteId).nome;
  const nAbertas = S.sess.perfil === "dona" ? C.abertas().length : 0;
  app.innerHTML = `<div class="app ${isTop ? "has-nav" : ""} ${out.foot ? "has-foot" : ""}">
    <header class="bar" id="bar">
      ${!isTop ? `<button class="icon-btn" data-action="back" aria-label="Voltar">${icon("back", 24)}</button>` : ""}
      <div class="bar-title"><span class="eyebrow">${esc(cfg.nomeLoja)}</span><h1>${esc(out.title)}</h1></div>
      <button class="who" data-action="sheet" data-type="perfil" aria-label="Perfil: ${esc(whoName)}"><span class="avatar ${S.sess.perfil === "cliente" ? "cli" : ""}">${initial(whoName)}</span><span>${S.sess.perfil === "dona" ? "Dona" : esc(whoName)}</span></button>
    </header>
    ${Store.readOnly ? `<div class="banner">Você pode ver, mas não alterar estes dados.</div>` : ""}
    <main class="screen" id="screen">${out.body}</main>
    ${out.foot ? `<div class="foot">${out.foot}</div>` : ""}
    ${isTop ? `<nav class="tabs" aria-label="Menu principal">${tabs.map(([k, l, ic]) => `<button class="tab" data-action="tab" data-view="${k}" ${topName === k ? 'aria-current="page"' : ""}>${icon(ic, 24)}<span>${l}</span>${k === "inicio" && nAbertas ? `<span class="dot">${nAbertas}</span>` : ""}</button>`).join("")}</nav>` : ""}
  </div>
  ${S.sheet && SHEETS[S.sheet.type] ? `<div class="sheet-wrap" data-action="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" data-action="noop">${SHEETS[S.sheet.type](S.sheet)}</div></div>` : ""}`;
  onScroll();
}
function onScroll() { const b = $("#bar"); if (b) b.classList.toggle("scrolled", window.scrollY > 4); }
window.addEventListener("scroll", onScroll, { passive: true });

/* ============ ações ============ */
const A = {
  noop() {},
  back() { back(); },
  go(d) { go({ name: d.view, id: d.id, acao: d.acao }); },
  replace(d) { replace({ name: d.view, id: d.id }); },
  tab(d) { resetTo({ name: d.view }); },
  sheet(d) { S.sheet = { type: d.type, id: d.id }; render(); setTimeout(() => { const f = $(".sheet input, .sheet .btn"); if (f) f.focus(); }, 30); },
  closeSheet() { S.sheet = null; render(); },
  sair() { sair(); },
  goAjustes() { S.sheet = null; go({ name: "ajustes" }); },
  filtro(d) { S.form.filtro = d.k; render(); },
  per(d) { S.form.per = d.k; render(); },
  async copy(d) {
    const el = document.getElementById(d.target); if (!el) return;
    try { await navigator.clipboard.writeText(el.value); toast("Texto copiado."); }
    catch (e) { el.focus(); el.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} toast(ok ? "Texto copiado." : "Texto selecionado: copie com o menu do celular."); }
  },
  conviteEnviado(d) { if (!Store.readOnly) Store.patch("clientes", d.id, { conviteEm: new Date().toISOString() }); return "keep"; },

  /* login */
  loginTel() {
    const tel = digits(S.login.tel);
    if (tel.length < 10) { S.login.err = "Digite o celular com DDD, por exemplo (95) 98111-0001."; return render(); }
    const cfg = C.cfg();
    const eDona = digits(cfg.telefoneDona) === tel;
    const cli = C.clientes().find((c) => digits(c.telefone) === tel);
    if (!eDona && !cli) { S.login.err = "Este número não está no caderno. Peça para a dona da lanchonete cadastrar você e mandar o convite."; return render(); }
    S.login = { step: "code", tel, code: "", err: "", perfil: eDona ? "dona" : "cliente", clienteId: cli ? cli.id : null };
    render(); setTimeout(() => $("#lg-code")?.focus(), 30);
  },
  loginCode() {
    if (S.login.code.trim() !== DEMO_CODE) { S.login.err = "Código errado. Confira o SMS e tente de novo."; return render(); }
    entrar(S.login.perfil === "dona" ? { perfil: "dona" } : { perfil: "cliente", clienteId: S.login.clienteId });
  },
  loginBack() { S.login = { step: "tel", tel: S.login.tel, code: "", err: "" }; render(); },
  demo(d) { entrar(d.perfil === "dona" ? { perfil: "dona" } : { perfil: "cliente", clienteId: d.id }); },
  async seed(d) { const ok = await Store.loadAll(d.kind === "zero" ? basico() : exemplo()); if (ok) toast("Caderno pronto."); },

  /* dona */
  qty(d) {
    const q = S.form.qtd = S.form.qtd || {};
    q[d.pid] = Math.max(0, (q[d.pid] || 0) + Number(d.d));
    const o = document.getElementById("q-" + d.pid); if (o) o.textContent = q[d.pid];
    const r = document.getElementById("pr-" + d.pid); if (r) r.classList.toggle("sel", q[d.pid] > 0);
    patchCompra();
  },
  async saveCompra() {
    if (Store.readOnly) return;
    const v = cur(); const r = compraResumo();
    if (!(r.total > 0)) return;
    const c = C.cliente(v.id);
    const id = Store.newId("lancamentos");
    const body = { clienteId: v.id, tipo: "compra", data: S.form.data || todayISO(), itens: r.itens, valor: r.total, criadoEm: new Date().toISOString(), autor: "dona" };
    if (await Store.put("lancamentos", id, body)) { S.stack.pop(); S.form = {}; render(); toast(`Anotado: ${money(r.total)} para ${c.nome}. Saldo: ${money(C.saldo(v.id))}.`); }
  },
  pvalor(d) { S.form.valor = toInput(Number(d.v)); const i = $("#p-valor"); if (i) i.value = S.form.valor; patchPag(); },
  async savePag() {
    if (Store.readOnly) return;
    const v = cur(); const val = parseMoney(S.form.valor);
    if (!(val > 0)) return;
    const c = C.cliente(v.id);
    const id = Store.newId("lancamentos");
    const body = { clienteId: v.id, tipo: "pagamento", data: S.form.data || todayISO(), valor: val, forma: S.form.forma || "Dinheiro", criadoEm: new Date().toISOString(), autor: "dona" };
    if (await Store.put("lancamentos", id, body)) { S.stack.pop(); S.form = {}; render(); const s = C.saldo(v.id); toast(`Pagamento de ${money(val)} registrado. ${s > 0 ? `${c.nome} ainda deve ${money(s)}.` : `${c.nome} está em dia.`}`); }
  },
  async saveCliente() {
    if (Store.readOnly) return;
    const f = S.form; const nome = (f.nome || "").trim(); const tel = digits(f.tel);
    let err = "";
    if (!nome) err = "Escreva o nome do cliente.";
    else if (tel.length < 10 || tel.length > 11) err = "Digite o celular com DDD (10 ou 11 números).";
    else if (C.clientes().some((c) => digits(c.telefone) === tel) || digits(C.cfg().telefoneDona) === tel) err = "Já existe alguém com este celular no caderno.";
    else if (!f.ok) err = "Confirme que o cliente concordou em guardar os dados.";
    if (err) { S.form.err = err; return render(); }
    const id = Store.newId("clientes");
    const body = { nome, apelido: (f.apelido || "").trim(), telefone: tel, criadoEm: new Date().toISOString(), consentimento: true };
    if (await Store.put("clientes", id, body)) replace({ name: "convite", id });
  },
  async aceitar() {
    const l = C.lanc(cur().id); if (!l || Store.readOnly) return;
    const resp = (S.form.resp || "").trim() || "Você tem razão. Cancelei esta anotação.";
    const ok = await Store.patch("lancamentos", l.id, { cancelado: true, canceladoEm: new Date().toISOString(), motivoCancelamento: "Contestação aceita", contestacao: Object.assign({}, l.contestacao, { status: "aceita", resposta: resp, respondidaEm: new Date().toISOString() }) });
    if (ok) { S.form = {}; render(); toast(`Anotação cancelada. Saldo de ${C.cliente(l.clienteId).nome}: ${money(C.saldo(l.clienteId))}.`); }
  },
  async manter() {
    const l = C.lanc(cur().id); if (!l || Store.readOnly) return;
    const resp = (S.form.resp || "").trim();
    if (!resp) { toast("Escreva uma resposta explicando para o cliente."); $("#ct-resp")?.focus(); return; }
    const ok = await Store.patch("lancamentos", l.id, { contestacao: Object.assign({}, l.contestacao, { status: "respondida", resposta: resp, respondidaEm: new Date().toISOString() }) });
    if (ok) { S.form = {}; render(); toast("Resposta enviada. A anotação foi mantida."); }
  },
  async confirmCancel(d) {
    const l = C.lanc(d.id); if (!l || Store.readOnly) return;
    const motivo = (S.sheet.motivo || "").trim() || "Cancelado pela dona";
    const ok = await Store.patch("lancamentos", l.id, { cancelado: true, canceladoEm: new Date().toISOString(), motivoCancelamento: motivo });
    if (ok) { S.sheet = null; render(); toast(`Anotação cancelada. Saldo: ${money(C.saldo(l.clienteId))}.`); }
  },
  async saveProduto() {
    if (Store.readOnly) return;
    const v = cur(); const f = S.form; const nome = (f.nome || "").trim(); const preco = parseMoney(f.preco);
    if (!nome) { S.form.err = "Escreva o nome do produto."; return render(); }
    if (!(preco > 0)) { S.form.err = "Digite o preço, por exemplo 7,00."; return render(); }
    const id = v.id || Store.newId("produtos");
    if (await Store.put("produtos", id, { nome, categoria: f.categoria || "Outros", preco, ativo: !!f.ativo })) { back(); toast(`${nome} salvo: ${money(preco)}.`); }
  },
  async savePrazo() {
    const n = parseInt(S.sheet.prazo ?? C.cfg().prazoAtraso, 10);
    if (!(n >= 1 && n <= 365)) { toast("Digite um prazo entre 1 e 365 dias."); return; }
    if (await Store.put("config", "loja", Object.assign({}, C.cfg(), { prazoAtraso: n }))) { S.sheet = null; render(); toast(`Prazo de atraso: ${n} dias.`); }
  },
  async saveAjustes() {
    const f = S.form; const tel = digits(f.tel); const n = parseInt(f.prazo, 10);
    let err = "";
    if (!(f.nomeLoja || "").trim() || !(f.nomeDona || "").trim()) err = "Preencha o nome da lanchonete e o seu nome.";
    else if (tel.length < 10 || tel.length > 11) err = "Digite o seu celular com DDD.";
    else if (C.clientes().some((c) => digits(c.telefone) === tel)) err = "Este celular já é de um cliente.";
    else if (!(n >= 1 && n <= 365)) err = "O prazo precisa ficar entre 1 e 365 dias.";
    if (err) { S.form.err = err; return render(); }
    if (await Store.put("config", "loja", { nomeLoja: f.nomeLoja.trim(), nomeDona: f.nomeDona.trim(), telefoneDona: tel, prazoAtraso: n })) { back(); toast("Ajustes salvos."); }
  },
  resetLocal() { if (confirm("Apagar tudo o que foi anotado neste aparelho e voltar ao exemplo do caderno?")) { Store.loadAll(exemplo()); S.stack = []; home(); toast("Dados de exemplo restaurados."); } },

  /* cliente */
  async enviarContest() {
    const l = C.lanc(cur().id); if (!l || Store.readOnly) return;
    if (!S.form.motivo) { S.form.err = "Escolha o que está errado."; return render(); }
    const ok = await Store.patch("lancamentos", l.id, { contestacao: { motivo: S.form.motivo, texto: (S.form.texto || "").trim(), em: new Date().toISOString(), status: "aberta" } });
    if (ok) { S.stack.pop(); S.form = {}; render(); toast("Enviado. A dona vai conferir e responder aqui."); }
  },
};

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const name = el.dataset.action;
  if (name === "noop") return;
  const fn = A[name]; if (!fn) return;
  if (editing()) document.activeElement.blur();
  const isLink = el.tagName === "A";
  if (!isLink) ev.preventDefault();
  fn(el.dataset, el, ev);
});

document.addEventListener("input", (ev) => {
  const el = ev.target;
  if (el.dataset.lf) { S.login[el.dataset.lf] = el.value; return; }
  if (el.dataset.sf) { S.sheet[el.dataset.sf] = el.value; return; }
  const k = el.dataset.f; if (!k) return;
  S.form[k] = el.type === "checkbox" ? el.checked : el.value;
  const name = cur().name;
  if (name === "compra") patchCompra();
  else if (name === "pagamento") patchPag();
  else if (name === "clientes" && k === "busca") { const l = $("#cl-list"); if (l) l.innerHTML = clientesList(); }
  else if (name === "escolher" && k === "busca") { const l = $("#esc-list"); if (l) l.innerHTML = escolherList(cur()); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target; const k = el.dataset.f; if (!k) return;
  S.form[k] = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "radio" && S.form.err) { S.form.err = ""; }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && S.sheet) { S.sheet = null; render(); }
  if (ev.key === "Enter" && ev.target.matches("input")) {
    const id = ev.target.id;
    if (id === "lg-tel") { ev.preventDefault(); A.loginTel(); }
    else if (id === "lg-code") { ev.preventDefault(); A.loginCode(); }
  }
});
document.addEventListener("focusout", () => { setTimeout(() => { if (pending && !editing()) render(); }, 0); });

Store.subs.push(render);
loadSess();
render();
Store.start();
})();
</script>

</body>
</html>
